<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MakerLens · 图片检测</title>
<style>
body{margin:0;background:#edf3f4;color:#19333c;font:17px/1.6 system-ui,sans-serif}main{max-width:1040px;margin:48px auto;padding:24px}h1{font-size:38px;margin:0}header p{color:#526771}section{background:white;border-radius:20px;padding:26px;margin:22px 0;box-shadow:0 5px 24px #16303b09}button{background:#116c64;color:white;border:0;padding:13px 25px;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}input{max-width:100%;margin:12px 18px 16px 0}img{max-width:100%;max-height:650px;display:block;margin:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #dde5e5}.note{font-size:14px;color:#526771}#status{min-height:28px}a{color:#116c64}
</style>
<main><header><span>MakerLens / 本地视觉原型</span><h1>看见手套与护目镜</h1><p>选择图片，查看两个模型给出的检测框与类别。</p></header>
<section><label for="file">图片文件（JPG / PNG，最大 15 MB）</label><br><input id="file" type="file" accept="image/jpeg,image/png"><button id="detect" disabled>开始检测</button><p id="status" role="status" aria-live="polite">请选择一张图片。</p><p class="note">图片在本机处理。结果用于人工复核；未出现检测框不能说明画面安全。</p></section>
<section id="result" hidden><img id="preview" alt="检测结果"><p id="count"></p><table><thead><tr><th>类别</th><th>模型置信度</th><th>框坐标</th></tr></thead><tbody id="rows"></tbody></table><p class="note">坐标对应上方缩放后的结果图。显示阈值为 0.4；置信度不代表安全程度。</p><a id="download" download="makerlens-result.jpg">保存结果图片</a></section>
<section id="review" hidden><h2>记录本次人工复核</h2><p class="note">每个问题保存一份记录。记录包含图片哈希和模型版本，不包含原图。保存后请放入私有复核目录。</p>
<label>错误类型 <select id="error-type"><option>漏检</option><option>误检</option><option>框不准</option><option>标签疑问</option><option>本图未发现问题</option></select></label><br>
<label>人物 / 场次代号 <input id="session" placeholder="例如 P02 / S03（不填姓名）"></label><br>
<label>真实类别 <select id="truth"><option value="unknown">待确认</option><option value="bare_hands">裸手</option><option value="gloves_worn">戴手套的手</option><option value="goggles_worn">佩戴护目镜</option><option value="eyes_unprotected">未保护眼部</option><option value="background">背景 / 无目标</option></select></label><br>
<label for="notes">位置、场景和复核意见</label><br><textarea id="notes" rows="4" style="width:95%" placeholder="例如：右下角白衣袖被识别为手套；建议补拍白衣袖训练素材。"></textarea><br>
<button id="save-review">保存复核记录</button><p id="review-status" role="status"></p></section>
<p><a href="/dashboard">查看仪表盘演示</a></p>
</main><script>
const file=document.querySelector('#file'),button=document.querySelector('#detect'),status=document.querySelector('#status'),result=document.querySelector('#result');
const names={goggles_worn:'佩戴护目镜',eyes_unprotected:'眼部未受护目镜保护',gloves_worn:'戴手套的手',bare_hands:'裸手'};
let latest=null;
file.onchange=()=>{latest=null;document.querySelector('#review').hidden=true;result.hidden=true;button.disabled=!file.files.length;status.textContent=file.files.length?'图片已选择，点击开始检测。':'请选择一张图片。';};
button.onclick=async()=>{
 const selected=file.files[0];if(!selected)return;
 if(selected.size>15*1024*1024){status.textContent='图片超过 15 MB，请缩小后重试。';return;}
 latest=null;document.querySelector('#review').hidden=true;
 button.disabled=true;file.disabled=true;result.hidden=true;
 status.textContent='正在本机加载模型并检测，请稍候…';
 try{
  const response=await fetch('/detect',{method:'POST',headers:{'X-MakerLens':'image','Content-Type':'application/octet-stream'},body:selected});
  const data=await response.json();if(!response.ok)throw Error(data.error||'检测失败');
  document.querySelector('#preview').src=data.image;document.querySelector('#download').href=data.image;
  const rows=document.querySelector('#rows');rows.replaceChildren();
  for(const det of data.detections){const row=rows.insertRow();for(const value of [names[det.class]||det.class,(det.confidence*100).toFixed(1)+'%',det.xyxy.join(', ')])row.insertCell().textContent=value;}
  document.querySelector('#count').textContent=data.detections.length?`发现 ${data.detections.length} 个目标`:'本次没有检测到目标，请人工核对画面。';
  latest={input_sha256:data.input_sha256,models:data.models,confidence:data.confidence,detections:data.detections};
  document.querySelector('#review').hidden=false;document.querySelector('#notes').value='';document.querySelector('#review-status').textContent='';
  result.hidden=false;status.textContent=`检测完成 · 推理及结果处理 ${data.seconds} 秒（不含模型加载）`;
 }catch(error){status.textContent=error.message||'连接失败，请确认本机服务仍在运行。';}
 finally{button.disabled=false;file.disabled=false;}
};
document.querySelector('#save-review').onclick=()=>{
 if(!latest)return;
 const notes=document.querySelector('#notes').value.trim();
 if(!notes){document.querySelector('#review-status').textContent='请填写复核意见，方便之后补拍和核对。';return;}
 const record={schema_version:1,created_at:new Date().toISOString(),...latest,
  error_type:document.querySelector('#error-type').value,
  participant_session:document.querySelector('#session').value.trim(),
  true_class:document.querySelector('#truth').value,notes,status:'待整理',training_authorized:false};
 const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));
 const link=document.createElement('a');link.href=url;link.download='makerlens-review-'+Date.now()+'.json';link.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 document.querySelector('#review-status').textContent='已发起记录下载，请确认保存。记录不会自动加入训练集。';
};
</script></html>
